<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Notes Summarizer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        button {
            display: block;
            margin: 0 auto;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            min-height: 50px;
        }
    </style>
</head>

<body>

    <h1>AI Notes Summarizer</h1>

    <textarea id="notes" placeholder="Paste your notes here..."></textarea>

    <button onclick="summarizeNotes()">Summarize</button>

    <div id="result">
        Your AI summary will appear here.
    </div>

    <script>
        async function summarizeNotes() {
            const notes = document.getElementById("notes").value;
            const result = document.getElementById("result");

            if (!notes.trim()) {
                result.textContent = "Please enter some notes first.";
                return;
            }

            result.textContent = "Generating summary...";

            const response = await fetch("/summarize", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: notes
                })
            });

            const data = await response.json();

            result.textContent = data.summary;
        }
    </script>

</body>
</html>
